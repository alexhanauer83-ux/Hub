name: Release APK

# Baut bei jedem Versions-Tag (z. B. v0.2.0) eine signierte Release-APK und
# haengt sie an ein GitHub-Release. Genau diese Releases liest Obtainium aus.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle-Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Keystore aus Secret wiederherstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.jks"

      - name: Signierte Release-APK bauen
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: APK umbenennen (Version im Dateinamen)
        run: |
          cp app/build/outputs/apk/release/app-release.apk "hub-${{ github.ref_name }}.apk"

      - name: GitHub-Release erstellen + APK anhaengen
        uses: softprops/action-gh-release@v2
        with:
          files: hub-${{ github.ref_name }}.apk
          generate_release_notes: true
